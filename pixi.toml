[workspace]
name = "oc-machine"
version = "0.1.0"
description = "Machines for OpenCode: SSH config, sudo, env vars and a per-agent permission table"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[dependencies]
nodejs = "24.*"
# Pinned OpenSSH for tests (`ssh -G` config validation, ssh-keygen). At runtime the plugin prefers the system ssh.
openssh = "*"

[tasks]
deps = "node scripts/deps.mjs"
deps-update = "node scripts/deps.mjs --refresh --shrinkwrap"
vendor-kit = "node scripts/vendor-kit.mjs"
check = { cmd = "npm run check", depends-on = ["deps"] }
build = { cmd = "npm run build", depends-on = ["deps"] }
test = { cmd = "npm test", depends-on = ["check"] }
doctor = { cmd = "node scripts/doctor.mjs", depends-on = ["build"] }
install = { cmd = "node scripts/install.mjs", depends-on = ["build", "test"] }
install-dev = { cmd = "node scripts/install.mjs --dev", depends-on = ["build"] }
uninstall = "node scripts/install.mjs --uninstall"
